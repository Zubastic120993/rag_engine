[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-engine"
version = "0.1.0"
description = "Local scoped RAG tool over a client CE document library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain==0.3.14",
  "langchain-community==0.3.14",
  "langchain-ollama==0.2.1",
  "langchain-chroma==0.1.4",
  "langchain-text-splitters==0.3.4",
  "chromadb==0.5.23",
  # chromadb 0.5.23's telemetry calls posthog the pre-6.0 way; posthog
  # 6.0.0 changed capture()'s signature and breaks every chromadb call.
  # Remove this pin once chromadb ships a release built against posthog>=6.
  "posthog<6.0.0",
  "ollama==0.3.1",
  "tenacity==9.0.0",
  "numpy>=1.26.0",
  "gradio==5.43.1",
  "pypdf==6.0.0",
  # pypdf only calls into cryptography for AES-encrypted PDFs (pypdf's own
  # setup declares it as the optional "crypto"/"full" extra, not a required
  # dependency) -- so a bare `pypdf==6.0.0` pin here was never sufficient to
  # reproduce AES extraction. This project's ingest pipeline treats it as a
  # first-class, required capability now (F-11): 32 currently-indexed
  # documents, two of them F-16 confirmed-duplicate-pair members, depend on
  # it. Pinned explicitly rather than left implicit.
  "cryptography==49.0.0",
  "pydantic==2.9.2",
  "python-dotenv==1.0.1",
  "requests==2.32.3",
  "openai>=1.68.2",
  "tqdm==4.66.5",
  "PyYAML>=6.0",
]

[project.scripts]
rag-engine = "rag_engine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["rag_engine*"]

[tool.setuptools.package-data]
rag_engine = ["scopes.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
